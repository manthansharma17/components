<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expandable Cards</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="page">

    <header class="heading">
      <span>INTERACTION LAB / 007</span>
      <h1>Explore the <i>Unknown.</i></h1>
      <p>Every frame tells a different story.</p>
    </header>

    <section class="gallery">

      <article class="expand-card active"
        style="--image: url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1200')"
        role="button" tabindex="0" aria-expanded="true">

        <div class="overlay"></div>
        <div class="card-number">01</div>

        <div class="card-content">
          <span class="category">01 / NATURE</span>
          <h2>Into the<br>Wild.</h2>
          <p>Discover the beauty of places untouched by time.</p>
          <span class="explore">EXPLORE STORY ↗</span>
        </div>

        <div class="card-icon">↗</div>
      </article>

      <article class="expand-card"
        style="--image: url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1200')"
        role="button" tabindex="0" aria-expanded="false">

        <div class="overlay"></div>
        <div class="card-number">02</div>

        <div class="card-content">
          <span class="category">02 / NIGHTLIFE</span>
          <h2>After<br>Dark.</h2>
          <p>When the city lights up, a new world begins.</p>
          <span class="explore">EXPLORE STORY ↗</span>
        </div>

        <div class="card-icon">↗</div>
      </article>
