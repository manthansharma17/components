<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spotlight Reveal Cards</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <main class="page">

    <header class="heading">
      <span>INTERACTION LAB / 010</span>
      <h1>Light <i>Uncovers.</i></h1>
      <p>Move your cursor. Discover what's hidden.</p>
    </header>

    <section class="card-grid">

      <article class="spot-card">
        <div class="image grayscale">
          <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1000" alt="Night sky">
        </div>

        <div class="image color reveal">
          <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1000" alt="">
        </div>

        <div class="dark-overlay"></div>

        <div class="card-info">
          <span>01 / THE NIGHT</span>
          <h2>Into the<br>Darkness.</h2>
        </div>

        <div class="card-footer">DISCOVER MORE ↗</div>
      </article>
