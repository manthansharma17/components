<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Border Cards</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <main class="wrapper">

    <header class="heading">
      <span>INTERACTION LAB / 005</span>
      <h1>Electric <i>Energy.</i></h1>
      <p>Where light becomes an experience.</p>
    </header>

    <section class="cards">

      <article class="neon-card purple">
        <div class="neon-border"></div>
        <div class="card-inner">

          <div class="top">
            <span>01 / CREATIVE</span>
            <span class="arrow">↗</span>
          </div>

          <div class="visual">
            <div class="energy energy-purple"></div>
            <div class="energy-core">✳</div>
          </div>

          <div class="content">
            <span class="tag">DREAM WITHOUT LIMITS</span>
            <h2>Beyond<br>Reality.</h2>
            <p>Imagine something extraordinary. Then make it real.</p>
          </div>

          <div class="bottom">
            <span>EXPLORE EXPERIENCE</span>
            <span>→</span>
          </div>

        </div>
      </article>
