
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating 3D Gallery</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <main class="gallery-scene">

    <div class="noise"></div>

    <div class="gallery-stage" id="gallery">

      <div class="gallery-card" data-index="0">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=700"
             alt="Fashion portrait">
      </div>

      <div class="gallery-card" data-index="1">
        <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700"
             alt="Editorial portrait">
      </div>

      <div class="gallery-card" data-index="2">
        <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=700"
             alt="Fashion editorial">
      </div>

      <div class="gallery-card" data-index="3">
        <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=700"
             alt="Portrait photography">
      </div>

      <div class="gallery-card" data-index="4">
        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=700"
             alt="Male portrait">
      </div>

      <div class="gallery-card" data-index="5">
        <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=700"
             alt="Fashion portrait">
      </div>

      <div class="gallery-card" data-index="6">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=700"
             alt="Studio portrait">
      </div>

    </div>

    <div class="bottom-label">
      <span>SPATIAL IMAGE EXPERIENCE</span>
      <span>MOVE YOUR CURSOR TO INTERACT</span>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
